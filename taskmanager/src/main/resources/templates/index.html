
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f46e5,#9333ea,#ec4899);
            padding:30px;
        }

        .container{
            width:100%;
            max-width:650px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:25px;
            padding:35px;
            box-shadow:0 10px 40px rgba(0,0,0,0.25);
            color:white;
        }

        .title{
            text-align:center;
            font-size:36px;
            font-weight:700;
            margin-bottom:8px;
        }

        .subtitle{
            text-align:center;
            opacity:0.8;
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:18px;
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            outline:none;
            border-radius:14px;
            background:rgba(255,255,255,0.2);
            color:white;
            font-size:15px;
        }

        input::placeholder{
            color:#f3f3f3;
        }

        .add-btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:14px;
            background:white;
            color:#6d28d9;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .add-btn:hover{
            transform:translateY(-2px);
            background:#f3f3f3;
        }

        .task-heading{
            margin-top:35px;
            margin-bottom:15px;
            font-size:24px;
            font-weight:600;
        }

        #taskList{
            list-style:none;
        }

        .task-card{
            background:rgba(255,255,255,0.18);
            border-radius:18px;
            padding:18px;
            margin-bottom:15px;
            animation:fadeIn 0.4s ease;
            position:relative;
        }

        .task-title{
            font-size:20px;
            font-weight:600;
            margin-bottom:6px;
        }

        .task-desc{
            opacity:0.9;
            line-height:1.5;
        }

        .delete-btn{
            margin-top:15px;
            border:none;
            background:#ef4444;
            color:white;
            padding:10px 18px;
            border-radius:10px;
            cursor:pointer;
            font-weight:500;
            transition:0.3s;
        }

        .delete-btn:hover{
            background:#dc2626;
            transform:scale(1.03);
        }

        .empty{
            text-align:center;
            opacity:0.8;
            margin-top:20px;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:600px){

            .container{
                padding:25px;
            }

            .title{
                font-size:28px;
            }

        }

    </style>
</head>
<body>

<div class="container">

    <h1 class="title">Task Manager</h1>

    <p class="subtitle">Manage your daily tasks easily</p>

    <div class="input-box">
        <input type="text" id="title" placeholder="Enter task title">
    </div>

    <div class="input-box">
        <input type="text" id="description" placeholder="Enter task description">
    </div>

    <button class="add-btn" onclick="addTask()">
        + Add Task
    </button>

    <h2 class="task-heading">Your Tasks</h2>

    <ul id="taskList"></ul>

</div>

<script>

    const API_URL = "http://localhost:8083/tasks";

    async function loadTasks(){

        const response = await fetch(API_URL);

        const tasks = await response.json();

        const taskList = document.getElementById("taskList");

        taskList.innerHTML = "";

        if(tasks.length === 0){

            taskList.innerHTML = `
                <p class="empty">No tasks added yet</p>
            `;

            return;
        }

        tasks.forEach(task => {

            taskList.innerHTML += `

                <li class="task-card">

                    <div class="task-title">
                        ${task.title}
                    </div>

                    <div class="task-desc">
                        ${task.description}
                    </div>

                    <button class="delete-btn"
                    onclick="deleteTask(${task.id})">
                        Delete
                    </button>

                </li>
            `;
        });
    }

    async function addTask(){

        const title = document.getElementById("title").value;

        const description = document.getElementById("description").value;

        if(title === "" || description === ""){
            alert("Please fill all fields");
            return;
        }

        await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                title,
                description
            })

        });

        document.getElementById("title").value = "";
        document.getElementById("description").value = "";

        loadTasks();
    }

    async function deleteTask(id){

        await fetch(API_URL + "/" + id,{
            method:"DELETE"
        });

        loadTasks();
    }

    loadTasks();

</script>

</body>
</html>
